<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lambdah Admin — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:     #0b0f1a;
            --card:   #111827;
            --border: rgba(255,255,255,0.07);
            --blue:   #3b82f6;
            --teal:   #14b8a6;
            --text:   #f1f5f9;
            --muted:  #64748b;
            --error:  #ef4444;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glow {
            position: fixed;
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59,130,246,0.08), transparent 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 380px;
            max-width: 95vw;
            position: relative;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .logo-mark {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--blue), var(--teal));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Space Mono', monospace;
            font-size: 13px; font-weight: 700; color: #fff;
        }
        .logo-text {
            font-family: 'Space Mono', monospace;
            font-size: 15px; font-weight: 700;
        }
        .logo-text span { color: var(--teal); }
        h2 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
        p.sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 11px;
            font-family: 'Space Mono', monospace;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 7px;
        }
        input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 11px 14px;
            font-size: 14px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--blue); }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--blue), #2563eb);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            margin-top: 8px;
            transition: opacity 0.2s, transform 0.2s;
            box-shadow: 0 4px 16px rgba(59,130,246,0.3);
        }
        .btn:hover { transform: translateY(-1px); opacity: 0.92; }
        .alert {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: var(--error);
            margin-bottom: 18px;
        }
        .back-link {
            display: block;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            margin-top: 20px;
            text-decoration: none;
        }
        .back-link:hover { color: var(--blue); }
    </style>
</head>
<body>
<div class="glow"></div>
<div class="card">
    <div class="logo">
        <div class="logo-mark">LS</div>
        <div class="logo-text">Lambdah<span>.dev</span></div>
    </div>
    <h2>Admin Access</h2>
    <p class="sub">Sign in to manage your portfolio content.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" autocomplete="username" autofocus required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn">Sign In →</button>
    </form>
    <a href="{{ url_for('index') }}" class="back-link">← Back to portfolio</a>
</div>
</body>
</html>
